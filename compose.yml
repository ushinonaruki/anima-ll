# AnIma-ll の実行環境
#
#   docker compose build
#   docker compose up -d ollama                 # ローカル LLM（初回は models/ の GGUF を登録する）
#   docker compose logs -f ollama               # 登録の様子を見る
#   docker compose run --rm anima               # L1：コンソールで話しかける（Ctrl+C で停止）
#   docker compose run --rm --no-deps anima python -m anima_ll \
#       --environment config/environment/l0-fake.yaml --pulses 120 --clock fast   # L0 の動作テスト
#   docker compose run --rm test                # テスト
#   docker compose down                         # ollama も止める

name: anima-ll

x-common: &common
  pull_policy: build   # イメージは常にローカルでビルドする（Docker Hub に取りに行かない）

x-tz: &tz
  TZ: ${TZ:-Asia/Tokyo}   # ログのファイル名・時刻を手元の時間に合わせる

services:
  anima:
    <<: *common
    build:
      context: .
      target: runtime
    image: anima-ll:runtime
    environment:
      <<: *tz
      ANIMA_GIT_COMMIT: ${ANIMA_GIT_COMMIT:-}   # コードの版をログに残す（実験時は export ANIMA_GIT_COMMIT=$(git rev-parse HEAD)）
    stdin_open: true   # コンソールから話しかけるため
    tty: true
    depends_on:
      - ollama         # 起動は待つが、準備完了は待たない（LLM がなくても本体は動き続ける）
    volumes:
      - ./config:/app/config:ro   # 設定はビルドし直さずに差し替えられる
      - ./data:/app/data          # 来歴ログと個体のスナップショットは手元に残す
      - ./experiments:/app/experiments:ro   # 実験の集計スクリプトをコンテナ内で動かすため

  ollama:
    <<: *common
    build:
      context: docker/ollama
      args:
        OLLAMA_VERSION: 0.35.1   # 動作を確認した版に固定（2026-10-06）
    image: anima-ll:ollama
    environment:
      <<: *tz
      ANIMA_GGUF: ${ANIMA_GGUF:-Llama-3.2-3B-Instruct-Q5_K_M.gguf}
      OLLAMA_KEEP_ALIVE: 24h   # モデルをメモリに置いたままにする（読み込み直しで推論時間が跳ねないように）
      OLLAMA_NUM_PARALLEL: "1"  # 計算資源の容量は Runtime 側（llm_pool の capacity）で管理する
    volumes:
      - ./models:/models:ro          # GGUF（Git 管理外）
      - ollama-data:/root/.ollama    # 登録済みモデル（2 回目以降は登録し直さない）
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s          # 確認のたびに Ollama のログに 2 行出るので、間隔は長めに
      start_period: 300s     # 初回のモデル登録の間は失敗を数えない
      start_interval: 5s
      timeout: 5s
      retries: 3
    # ports:
    #   - "11434:11434"   # 手元から Ollama を直接触りたいときだけ
    # NVIDIA GPU を使う場合（NVIDIA Container Toolkit が必要）:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  test:
    <<: *common
    build:
      context: .
      target: dev
    image: anima-ll:dev
    environment:
      <<: *tz
    profiles: ["test"]   # `docker compose up` では起動しない

volumes:
  ollama-data:
