# 実験 0043 の実行条件と記録項目（事前登録 v0.2。#200 のレビュー 6088937430 の修正必須 4 件を反映。ChatGPT の再レビュー待ち・未確定。この実験の道具の実装の前に固定する）
#
# 候補 A（docs/as2b-post-0042-next-stage-proposal.md v0.3）：AS2b の関門の組（予定・窓・出口・世界・役。関門の宣言 v0.2）と
# C0 の力学・可塑性のもとで、同じ個体の二つの本体（規則 c = A1 と c = A2）を、経験の区間 E（窓 1〜25）の終わりの境界 P_E = 1065 まで
# 走らせる。自然な差 e = W_A1 - W_A2（P_E の 6 本の重みの差）の向きを保ったまま、各背景の重み W_c を中心に、倍率 k だけ両側に動かした
# 二つの人工の重み W_c + k e と W_c - k e を P_E で複製に移植し、試しの区間 U（窓 26〜50）で 6 本を FREEZE して閉ループで走らせる。
# C_k = [s(G_A1[W_A1 + k e]) - s(G_A1[W_A1 - k e])] + [s(G_A2[W_A2 + k e]) - s(G_A2[W_A2 - k e])]（s は U の A1 の割合）。
# 主の段 k0 = 2 の C_2 の符号を個体の事象にし、C_2 が定まり 0 でない個体の中で、向きのそろいを両側で判定する（J_C。0042 の J_T と同じ形）。
# 段の組 {1, 2, 4, 8} のほかの段、δ をそろえた対称な介入の対照 D^u_k、0042 型の T、端の感度の対照 S などは記述で、判定しない。
#
# 実行の形式は 0039 型の事前登録の実験（README §0.1）。この案の段階では、この実験の道具の実装・smoke・本番の測定・
# どの seed の実行もしない。0038〜0042 の記録（raw・report）は、この実験の判定にも設計にも使わない。0042 の README §15.6 の R4 の表の
# 公表した重みの五つの数だけを、主の段と段の組の範囲の算術に使う（README §4.6・§11）。
# 確定の後は、測定の結果（本番・smoke・合成のどれでも）を見てからの事後の変更は禁止。変更が要る場合は理由と見たもの・使った seed を
# 開示し、新しい版・新しい seed の範囲で行う。
#
# 種別：事前登録した検証。主の判定は J_C の一つ（誤りの水準 0.05）。主の推定 E_C は判定ではない。
# 値はどれも、この実験の手順を決める足場で、AnIma-ll の脳の生物値ではない。新しく選んだ値とその理由は README §1.2・§4.6・§4.7。

