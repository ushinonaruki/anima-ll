brain:                                  # C0 のまま（関門と同じ）
  manifest: experiments/0012_passive_world/neuroarchitecture.yaml
  units: [s1, s2, s3]
  roles: "random.Random('as2b-roles-{seed}').shuffle([s1, s2, s3]) -> (cue, source1, source2)"
  action_ids: {source1: A1, source2: A2}
  receptor_weight: 1.0
  refractory_pulses: 0
  plastic_connections: six_s_to_s
  plasticity_rule: balanced_pair_window
  initial_weight_w0: 0.005
  w_min: 0.0
  w_max: 0.01
  adaptation_tau_pulses: 300

timeline:                               # 0042 と同じ。1 Pulse = 1 秒。窓 k = [41k + 2, 41k + 20]
  pulse_interval_seconds: 1.0
  experience_E: {windows: [1, 25], pulses: [1, 1065]}
  boundary_P_E: 1065
  last_E_outcome_pulse: 1047
  test_U: {windows: [26, 50], pulses: [1066, 2072], length: 1007}
  first_U_window: [1068, 1086]
  earliest_U_consequence_pulse: 1070
  body_pulses: 2072

world:                                  # README §2.4
  closed_loop: "every system: rule c of the background body, the world returns a consequence only to intents of action c (L = 2)"
  rule_c: {B_A1: A1, B_A2: A2, B_A1_rerun: A1, background: "every clone keeps the rule of the body it was cloned from"}
  not_used: [switch_world, replay, lc3, rule_change_at_boundary]

weights:                                # README §2.2
  order: [C_to_source1, source1_to_C, C_to_source2, source2_to_C, source1_to_source2, source2_to_source1]
  pairs: [[C_to_source1, source1_to_C], [C_to_source2, source2_to_C], [source1_to_source2, source2_to_source1]]
  arithmetic: "the P_E float values are taken as exact rationals (Fraction(float)); every endpoint weight is computed exactly and rounded once to the nearest float (float(Fraction))"
  e: "W_A1 - W_A2 (exact)"
  delta: "delta(D) = D(C_to_source1) - D(C_to_source2); delta(e) is the 0041-type delta of the individual"
  scheme: multiple                      # 倍数案。絶対量案は採らない（README §4.6）
  levels: [1, 2, 4, 8]
  k0: 2
  natural: "V_c_plus_k = W_c + k e, V_c_minus_k = W_c - k e"
  k1_identity: "V_A1_minus_1 == W_A2 and V_A2_plus_1 == W_A1 bitwise (SE-C8)"
  u: {C_to_source1: 1, source1_to_C: -1, C_to_source2: -1, source2_to_C: 1, source1_to_source2: 0, source2_to_source1: 0}   # (X1 - X2) / w_max、delta(u) = 2
  m_k: "k * |delta(e)| / 2 (exact); |delta(Y_plus - Y_minus)| = 4 m_k = 2k |delta(e)| = |delta(V_plus - V_minus)|"
  symmetric: "Y_c_plus_k = W_c + m_k u, Y_c_minus_k = W_c - m_k u"
  range: "an endpoint is out of range if the exact value of any of its six weights is outside [0, w_max] (w_max = the exact value of the float 0.01); an out-of-range endpoint is never clipped, its system is not built and not run; the names of the out-of-range weights and the side (below / above) are recorded"
  no_clip_reason: "clipping would lose the guarantee of the specified direction of e, the multiple k and the symmetry of the two endpoints about W_c (for F1 pairs clip(w_max - x) = w_max - clip(x), so clipping would not break the pair sum)"
  nesting: "per background, in range at k implies in range at every smaller level; both backgrounds' natural endpoints are in range iff W_A1 + k e and W_A2 - k e are in range (SE-C10)"
  f1_real: "F1 is an equality in real arithmetic (G-8): the pair sums of W_A1 and W_A2 are w_max, the pair sums of e and of u are 0, so V and Y keep the pair sum w_max exactly (SE-C9)"
  f1_float: "in floats the pair sums of W_A1, W_A2 carry rounding residuals r_A1, r_A2; the residual of V_c_plus_minus_k before rounding is r_c +/- k (r_A1 - r_A2) and of Y_c_plus_minus_k is r_c, plus at most half an ulp per weight from rounding; natural residuals within 1e-12 therefore do not imply endpoint residuals within 1e-12 (analysis.py f1_residual_example: +/-4e-13 gives about 2e-12 at k = 2; an arithmetic example against an inference from the tolerance, not a reachable body and not a violation in any individual)"

systems:                                # README §2.3。c in {A1, A2}
  B_c:        {build: "gate run_body construction build(seed, schedule, delay=2, rule_c=c, respond=True)", pulses: [0, 2072],
               U_world: closed_loop, U_plasticity: rule, role: "R-7 body; clone source; D and Z_c (descriptive)"}
  G_c_base:   {build: "S2 clone of B_c at P_E", at_P_E: "S4 FREEZE six (advance); no transplant", role: "base of one-sided differences, T and Z_c (descriptive); reference of O8"}
  G_c_Pk:     {build: "S2 clone of B_c at P_E if V_c_plus_k is in range", at_P_E: "S3 transplant six to V_c_plus_k; S4 FREEZE six", role: "C_k (main at k = 2; descriptive otherwise); T at k = 1 for c = A2"}
  G_c_Mk:     {build: "S2 clone of B_c at P_E if V_c_minus_k is in range", at_P_E: "S3 transplant six to V_c_minus_k; S4 FREEZE six", role: "C_k (main at k = 2; descriptive otherwise); T at k = 1 for c = A1"}
  G_c_UPk:    {build: "S2 clone of B_c at P_E if Y_c_plus_k is in range", at_P_E: "S3 transplant six to Y_c_plus_k; S4 FREEZE six", role: "delta-matched symmetric control D^u_k (descriptive)"}
  G_c_UMk:    {build: "S2 clone of B_c at P_E if Y_c_minus_k is in range", at_P_E: "S3 transplant six to Y_c_minus_k; S4 FREEZE six", role: "delta-matched symmetric control D^u_k (descriptive)"}
  G_c_X1:     {build: "S2 clone of B_c at P_E", at_P_E: "S3 transplant six to X1; S4 FREEZE six", role: "artificial-extreme sensitivity control S (descriptive; midpoint w0, not W_c)"}
  G_c_X2:     {build: "S2 clone of B_c at P_E", at_P_E: "S3 transplant six to X2; S4 FREEZE six", role: "same as G_c_X1"}
  G_c_tr:     {build: "S2 clone of B_c at P_E", at_P_E: "S3 transplant six to W_c (own values); S4 FREEZE six", role: "transplant identity, technical check (O8); not a finding"}
  B_A1_rerun: {build: "same as B_A1 without the added records", pulses: [0, 2072], role: "non-interference and gate-body identity (O13)", observed: false,
               run: "advance_to(P_E) in one call, write the full sigma, advance_to(2072) in one call, write the full sigma, then the end records; no other reading while running"}
  k_values: [1, 2, 4, 8]
  per_background_max: 20               # base 1 + natural 8 + symmetric 8 + X 2 + tr 1
  clones_per_individual_max: 40
  pulses_per_individual_max: 46496      # 3 x 2072 + 40 x 1007（analysis.py）。範囲の外の系は作らないので、それより少ない個体がある
  transplant: "all six at once; never one side only"
  trace_policy: advance
  observation:
    observed: "every built system except B_A1_rerun"
    not_observed: [B_A1_rerun]

extremes:                               # 0040 §2.3・0042 と同じ
  X1: {C_to_source1: 0.01, source1_to_C: 0.0, C_to_source2: 0.0, source2_to_C: 0.01, source1_to_source2: 0.005, source2_to_source1: 0.005}
  X2: {C_to_source1: 0.0, source1_to_C: 0.01, C_to_source2: 0.01, source2_to_C: 0.0, source1_to_source2: 0.005, source2_to_source1: 0.005}
  contrast_in_delta_units: 0.02
  midpoint: "w0 for all six (differs from W_c in general)"

level_choice:                           # README §4.6（analysis.py range_guide）。0042 §15.6 R4 の公表した周辺の五つの数だけを使う
  source: "0042 README section 15.6 R4 (published marginal five-number summaries of W_A1, W_A2 and |W_A1 - W_A2| at P_E); never the individual value sets, never selection results"
  conservative_bound: "min over connections of min(min_value, w_max - max_value) / max|diff| = 3.1347 (C_to_source2); C_to_source1 3.2239; source-source 7.0985"
  k4_width: "2 x 4 x 0.001321 = 0.010568 > w_max: the 0042 individual with the largest C_to_source2 difference cannot be in range at k = 4 whatever its centre"
  rough_guide: "min over connections of min(median, w_max - median) / Q3|diff| = 10.883 (C_to_source1); marginal combination, not the joint distribution"
  k0_rule: "the largest level in {1, 2, 4, 8} with (i) k > 1 (both endpoints artificial) and (ii) k <= the conservative bound -> 2; margin 3.1347 / 2 = 1.57"
  limitation: "(ii) is a sufficient condition for the 0042 published values only; it does not guarantee that no individual of the new 0043 population is out of range at k = 2; the number is unknown beforehand and is reported"
  top_rule: "the largest doubling level not above the rough guide -> 8"
  not_from_power: "k0 is not chosen from expected power or from any 0042 selection result (T, S, delta x T tables)"

boundary_sequence:                      # README §2.5
  S0: "advance B_A1 and B_A2 to the end of pulse P_E; check no open window, no pending intent, no consequence reservation and the full set of future cue reservations"
  S1: "read W_A1, W_A2 and the full sigma at P_E; compute e, delta(e), m_k and every endpoint exactly with its range"
  S2: "clone B_c -> G_c_base, in-range G_c_Pk / G_c_Mk / G_c_UPk / G_c_UMk, G_c_X1, G_c_X2, G_c_tr"
  S3: "transplant each built clone to its endpoint values (X1, X2, W_c for tr); G_c_base untouched; intervention state is empty"
  S4: "declare the U intervention once per clone: FREEZE six (advance)"
  S5: "advance B_A1, B_A2, B_A1_rerun and every built clone to pulse 2072"
  no_pulse_between: [S1, S4]
  effective_from: "pulse P_E + 1"
  compare_sigma_at: [after_S3, after_S4]

quantities:                             # README §3
  arithmetic: "exact rational arithmetic (fractions.Fraction); the sign is that of the exact value"
  s: "#A1_U / (#A1_U + #A2_U) over the decided windows of windows 26..50; undefined (None, never 0) if n_U = 0"
  s_c: "s if c = A1, 1 - s if c = A2"
  defined_rule: "a quantity is defined only if every system it uses is built and every s it uses is defined"
  C_k_c: "s(G_c_Pk) - s(G_c_Mk); uses only the two endpoint systems and is defined even when s(G_c_base) is undefined (e.g. 3/4 and 1/4 give 1/2); up_k_c, dn_k_c, T_c and Z_c, which use G_c_base, are then undefined"
  C_k: "C_k_A1 + C_k_A2 (individual value only if both backgrounds are in value classes 3..5; README section 4.2)"
  C_k_any: "defined iff C_k is defined; true iff C_k_A1 != 0 or C_k_A2 != 0"
  up_k_c: "s(G_c_Pk) - s(G_c_base)"
  dn_k_c: "s(G_c_base) - s(G_c_Mk)"
  identity: "C_k_c = up_k_c + dn_k_c only when G_c_base, G_c_Pk and G_c_Mk are all built and all three s are defined; arithmetic only (analysis.py checks it only in that case)"
  Du_k_c: "s(G_c_UPk) - s(G_c_UMk); uses only the two endpoint systems"
  Du_k: "Du_k_A1 + Du_k_A2 (same summation condition as C_k)"
  T_A1: "s(G_A1_base) - s(G_A1_M1)   # V_A1_minus_1 = W_A2"
  T_A2: "s(G_A2_P1) - s(G_A2_base)   # V_A2_plus_1 = W_A1"
  T: "T_A1 + T_A2 (0042-type natural swap; descriptive in this population; never merged with 0042)"
  S_c: "s(G_c_X1) - s(G_c_X2)"
  S: "S_A1 + S_A2"
  D: "s(B_A1) - s(B_A2)"
  Z_c: "s_c(B_c) - s_c(G_c_base)"
  delta_e: "delta(e) (README section 2.2)"
  plus_meaning:
    C_up_dn_T: "moving the weights along the natural difference toward the W_A1 side (the side formed under the rule that returns consequences to A1) gives a higher A1 share (rule meaning, as 0042 T); never oriented by delta"
    Du_S: "the side with C_to_source1 raised and C_to_source2 lowered (the X1 side) gives a higher A1 share (weight-direction meaning, as 0040 D^X and 0042 S); not the meaning of C"
  label_invariance: "with the six components in a fixed order and P the source-1 / source-2 permutation, the swap gives W'_A1 = P W_A2, W'_A2 = P W_A1, e' = -P e, P u = -u, delta(e') = delta(e), m_k unchanged, s -> 1 - s; new G_A1_Pk = old G_A2_Mk, new G_A1_UPk = old G_A2_UMk, new G_A1_X1 = old G_A2_X2; C_k, C_k_any, Du_k, T, S, D, delta(e) are unchanged exactly; C_k_A1/C_k_A2, Du_k_A1/Du_k_A2, up_k_A1/dn_k_A2, dn_k_A1/up_k_A2, T_A1/T_A2, S_A1/S_A2, Z_A1/Z_A2 are exchanged (analysis.py weight_arithmetic_check and label_swap_and_identity_check; on real records: CT-43-9); not a basis for sign symmetry"
  no_ratio: "no ratio (C_k / T etc.) is computed"
  k_star: "the first window in 1..25 whose outcome in the common part of the two bodies is A1 or A2 (none if no such window)"

value_classes:                          # README §4.1。(individual, c, k) ごとに、C_k_c と Du_k_c のそれぞれ。順に確かめる
  order: [out_of_range, s_undefined, structural_zero, measured_zero, nonzero]
  out_of_range: "at least one of the two endpoints is out of range; its system is not built"
  s_undefined: "both endpoint systems are built and n_U = 0 in at least one"
  structural_zero: "the two endpoints' six weights are bitwise identical after rounding and s is defined (exactly 0); C: e = 0 (labels Z-1, Z-2, identity); Du: delta(e) = 0; any other coincidence by rounding is labelled rounding_coincidence and disclosed; if s of the endpoint systems is undefined the class is s_undefined, never structural_zero, even when e = 0"
  measured_zero: "the endpoints differ, s is defined and the difference is 0"
  nonzero: "the endpoints differ, s is defined and the difference is not 0"
  not_occurring: "factor_undefined and not_run of the proposal do not occur under the multiple scheme"

judgment:
  per_individual:                       # README §4.3（k = 2）
    undefined_u: "C_2 undefined (either background out of range or s undefined); in neither m_nonzero nor m_def; counted by reason and background"
    structural_zero: "C_2 defined (both backgrounds' endpoint systems have s defined) and both backgrounds structural zero (e = 0); a zero; labels Z-1 / Z-2 / identity / rounding_coincidence; e = 0 with undefined endpoint s is undefined_u (s_undefined)"
    other_zero: "C_2 defined, not structural, C_2 == 0; split into both_zero and cancellation (C_2_A1 == -C_2_A2 != 0)"
    structurally_silent_source: "a source with g < -E_S (proposition S-1); labelled and counted; never removed (SE-C13)"
    sign: {plus: "C_2 > 0", minus: "C_2 < 0", zero: "C_2 == 0", undefined: "C_2 undefined"}
    out_of_range_at_k0: "counted as undefined; no threshold on its count; the judgment form does not change; that k = 2 is in range is a sufficient condition for the 0042 published values only, and the number of out-of-range individuals in the new 0043 population is unknown beforehand and is reported by reason, background and endpoint"
    no_post_hoc_exclusion: "no other exclusion; labels are never used to remove an individual"
  J_C:
    level: 2
    population: "individuals with C_2 defined and C_2 != 0; m_nonzero = count(plus) + count(minus)"
    min_population: 10
    below_min: inconclusive
    rule: "plus if count(plus) >= k2(m_nonzero); minus if count(minus) >= k2(m_nonzero); otherwise not established"
    alpha: {two_sided: 0.05, per_direction: 0.025}
    only_judgment: true                 # 判定はこれだけ。ほかの段・E_C・記述・補助の記録は検定しない（多重性なし）
    form_inherited: "the form of 0042 J_T (accepted in #195 before any 0042 seed was run) is inherited unchanged; the author knows the 0042 results (including the zero share of T), which may have influenced the choice of question and design; this is disclosed (README section 4.7 (c)); revert to the house form only if the review so decides"
    not_judged: [C_1, C_4, C_8, Du_k, T, S, D, Z_c, slope_over_levels, one_background_only, house_form]
  null_hypothesis:
    status: "explicit statistical null on the post-selection population of individuals with C_2 defined; assumed, not derived (C_2 is label-invariant, the definedness condition gives no sign symmetry, G-11 gives no direction)"
    H0_C: "with birth states iid, P(C_2 > 0) = P(C_2 < 0) in the population of individuals with C_2 defined"
    conditional_exactness: "under H0_C and the iid model, given the set of nonzero individuals and m_nonzero, count(plus) ~ Bin(m_nonzero, 1/2) exactly"
  k2_rule: "smallest k with P(Bin(m, 1/2) >= k) <= 1/40 (exact fractions; analysis.py; same values as the 0039 and 0042 tables)"
  k2_of_m: {10: 9, 11: 10, 12: 10, 13: 11, 14: 12, 15: 12, 16: 13, 17: 13, 18: 14, 19: 15, 20: 15, 21: 16, 22: 17,
