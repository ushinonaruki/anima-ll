estimate_E_C:                           # README §4.5。判定ではない。有効なら成否に依らず報告する
  m_def: "number of individuals with C_2 defined (200 minus undefined)"
  p_nz: "m_nonzero / m_def, Clopper-Pearson 95%; not the share whose choice changed"
  p_any: "count(C_2_any) / m_def, Clopper-Pearson 95%; descriptive"
  cancellations: "count of C_2_A1 = -C_2_A2 != 0"
  p_plus_minus: "count(plus) / m_def and count(minus) / m_def, Clopper-Pearson 95%"
  p_dir: "count(plus) / m_nonzero, Clopper-Pearson 95% (undefined if m_nonzero = 0)"
  abs_C2: "min, quartiles, max over individuals with C_2 defined and over individuals with C_2 != 0"
  undefined_count: "200 - m_def with the breakdown by reason and background"
  no_threshold: true
  zero_denominator: "a ratio or interval whose denominator is 0 is undefined (e.g. p_dir when m_nonzero = 0)"
  shown_only_when_valid: true
  reporting_prominence: "whenever J_C is reported, m_nonzero / m_def, p_nz and p_any with their intervals are shown in the same table and paragraph with the same prominence as the J_C direction"

must_report:                            # README §6。検定しない。各量：分母、＋・−・0、割合と区間、0 でない中の＋の割合、分布、定まらない理由の内訳
  levels: "C_k for k in 1, 2, 4, 8 with the summation condition and the classes of README section 4.3; denominator = individuals with C_k defined at that level"
  common_all_levels: "the set of individuals with C_k defined at all four levels, its size, and the per-level descriptions on that set; differences between levels are never read as an effect of the multiple alone"
  out_of_range: "counts by level, background and endpoint side; counts by weight name; agreement with the nesting (SE-C10)"
  per_background: "C_k_c by level; (sign C_k_A1, sign C_k_A2) in 9 cells; individuals with only one background defined in a separate table"
  one_sided: "(sign up_k_c, sign dn_k_c) in 9 cells for (c, k) with the three systems built and defined"
  base_strata: "sign of C_2_c by the class of s(G_c_base) in {0, 1, strictly between, undefined}, per background"
  symmetric_control:
    Du_k: "Du_k by level with the summation condition; proportion denominator = individuals with Du_k defined and neither background structural zero; the structural-zero count (delta(e) = 0, rounding coincidence) shown separately"
    eligibility: "(c, k) is eligible for the comparison iff both C_k_c and Du_k_c are in value classes measured_zero or nonzero (endpoints differ, s defined); an individual is eligible at k iff both backgrounds are eligible; this rewrites condition (b) of the proposal (classes 3..5 and delta(e) != 0) by requiring different endpoint weights, so coincidences by rounding are also excluded; delta(e) = 0 is never eligible"
    table: "per level, the number of eligible individuals and (sign C_k, sign Du_k) in 9 cells split by delta(e) > 0 and delta(e) < 0; the same per (c, k); the all-level eligible set and its table"
    ineligible: "counts by reason (C out of range, Du out of range, s undefined, C structural zero, Du structural zero)"
    reading: "C and Du signs have different meanings; when delta(e) < 0 the plus endpoint of C lies on the -u side in delta; for e = -b u the endpoint pairs coincide and C_k = -Du_k (SE-C11); only tables split by the sign of delta(e) are shown; only the magnitude of delta is matched (common change and source-source components are not); never 'same magnitude, different shape', never a separation of magnitude and shape"
  T: "T_A1, T_A2, T; (sign T_A1, sign T_A2) in 9 cells; descriptive in this population; never a re-test of 0042 J_T, never merged"
  sensitivity: "S_A1, S_A2, S; midpoint w0; a positive response is not guaranteed; used only as material when reading a negative result"
  natural_pair: "D (descriptive total effect; never a re-test of 0039 J_7)"
  plasticity_contrast: "Z_A1, Z_A2 (with s_c)"
  delta_e: "plus / minus / zero and distribution of delta(e); count of delta(e) = 0 with e != 0; never a re-test of J_B"
  zero_table: "structural zeros (Z-1 / Z-2 / identity / rounding coincidence), other zeros (both zero / cancellation), undefined (reason and system names), structurally silent sources, listed by seed"
  not_made: "no cross tables of sign delta(e), sign S or sign T against sign C_k (other than the comparison table above); no correlation test"

records:                                # README §6.4
  R1: "roles, birth theta and c of the 3 units, margins g, S-1 label per source, k*, classes and labels of README sections 4.1 and 4.3"
  R2: "per built system: decided, A1, A2, tie, none counts in E (bodies) and U, and s"
  R3: "distributions of every quantity of README section 3.2 and of their absolute values"
  R4: "W_A1, W_A2, e, delta(e), m_k; pair sums and their largest deviation from w_max; six weights and pair sums of every built clone after transplant; for systems not built, the names and sides of the out-of-range weights"
  R5: "consequence stimuli received per system in E and U (SE-C3)"
  R6: "first pulse at which all-unit firings and window outcomes differ: B_A1 vs B_A2; G_c_base vs every built clone of the same background; number of pairs that never diverge"
  R7: "firing counts of the 3 units per built system in E and U"
  R8: "Clopper-Pearson intervals"
  R9: "per body, s in E and s in U (within-body before/after; not a counterfactual)"

structural_equivalences: [SE-C1, SE-C2, SE-C3, SE-C4, SE-C5, SE-C6, SE-C7, SE-C8, SE-C9, SE-C10, SE-C11, SE-C12, SE-C13, SE-C14, SE-C15]   # README §7.1

proposition_S1:                         # README §7.2（analysis.py）。実験 0039 §7.2 の命題 S-1 をそのまま引き継ぐ
  E_S: "w_max * ((1 + lambda^4) / (1 - lambda^23) + 2 / (1 - lambda^7))"
  E_S_value: 0.04503
  condition: "g = c / (1 - lambda) - theta < -E_S"
  holds_in: "every built system (all weights in [0, w_max]; out-of-range endpoints are never built)"
  per_source_share: 0.0292
  individual_share_at_least_one: 0.0576
  use: "labels only; never used in the judgment or the estimate. A recorded violation is disclosed and the labels are withdrawn; the judgment does not change"

operation_checks: [O1, O2, O3, O4, O5, O6, O7, O8, O9, O10, O11, O12, O13, O14, O15]   # README §8。一つでも不成立なら無効
operation_checks_note: "S-1 violations, out-of-range counts, S and Du values are recorded, not operation checks (D1)"
O11_tolerance_status: "1e-12 on the rounded pair sums of every built system is a fixed operational condition (same width as 0041 and 0042), not a bound derived for reachable bodies (SE-C9 is an equality in real arithmetic); any built system beyond it makes the whole run invalid, as in v0.1"
O10_weight_arithmetic: "recompute e, delta(e), m_k and every endpoint (exact value, range, rounded value) from the saved P_E sigma: (a) transplanted values of built systems agree bitwise, (b) the set of built systems equals the set of in-range endpoints and the recorded out-of-range names and sides agree, (c) V_A1_minus_1 == W_A2 and V_A2_plus_1 == W_A1 bitwise"
f1_tolerance: 1.0e-12

not_displayed:                          # README §9.3。契約テスト（合成の seed）と smoke では計算しても表示・保存しない
  quantities: [s, n_U, C_k, C_k_c, C_k_any, up_k_c, dn_k_c, Du_k, Du_k_c, T, T_A1, T_A2, S, S_A1, S_A2, D, Z_A1, Z_A2,
               delta_e, W_A1, W_A2, e, m_k, out_of_range_counts, out_of_range_names, eligibility_counts, signs, direction_counts,
               m_nonzero, m_def, E_C, p_nz, p_any, cancellations, clopper_pearson, k_star, individual_classes,
               choice_counts, consequence_counts, first_divergence_pulse]
  contract_tests: "arithmetic is checked on hand-made records; values from real trajectories are checked for consistency only and never printed; test modules use PYTEST_DONT_REWRITE and assertion messages never carry evaluated values, and a test checks this mechanism (0041 CT-41-7 and 0042 lessons); any new exposure path means stop, disclose and re-review"
  smoke: "ok / fail of the operation checks only"

storage:                                # README §9.1
  raw: "seeds/<seed>/raw.json.gz (guard), copied byte for byte to results/ and checked with analyze.py --verify-copy"
  differences_from_0042: "the number of built clones varies by individual; systems not built carry only the out-of-range names and sides; e, delta(e) and m_k are auxiliary records recomputed from the P_E sigma (O10); no N systems"
  sigma: {pulse_0: "B_A1, B_A2", k_star_intent: "B_A1, B_A2 after the intent pulse of k* (if k* exists)",
          P_E: "B_A1, B_A2 and B_A1_rerun: full sigma and SHA-256", clones: "after S3, after S4, after pulse 1066",
          end: "every built system at pulse 2072: full sigma and SHA-256"}
  pulse_weights: "built clones only, every U pulse (FREEZE check O7)"
  sigma_scope: "the AS2b tool sigma; it does not contain the provenance log"
  numbers: "JSON numbers that round-trip with Python repr; equality of values (SHA-256 auxiliary)"
  protocol_binding: "analyze.py checks meta.protocol against the canonical protocol; the independent recheck holds the canonical-JSON SHA-256 and the file SHA-256 of the frozen protocol (same form as 0042)"
  independent_recheck: "stdlib only; does not import analyze.py, measure.py, anima_ll or the AS2b tools; rebuilds every report field from the raw records, rewrites the weight arithmetic in rationals, compares all fields, checks provenance and completeness of the 200 seeds itself"

one_time: "the judgment seeds run once (guard claim bound to the protocol hash before the first seed); invalid means no judgment and no rerun or filling on the same seeds; inconclusive or not established means no rerun and no added individuals; after running, README, protocol and tools are not changed"
