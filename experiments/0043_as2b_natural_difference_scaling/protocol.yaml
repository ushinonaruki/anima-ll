  interval: "Clopper-Pearson 95% (two-sided); always reported when the denominator >= 1 (D6)"
  outcomes: [invalid, inconclusive, not_established, plus, minus]
  outcome_rules:
    invalid: "at least one operation check fails: report only which checks failed; the judgment, the estimate and the must-report descriptions are not computed or displayed"
    inconclusive: "valid and m_nonzero < 10: the direction is not judged and is not compared with any threshold (e.g. 9 nonzero individuals all plus is inconclusive)"
    not_established: "valid, m_nonzero >= 10 and neither count(plus) nor count(minus) reaches k2(m_nonzero)"
    plus_minus: "valid, m_nonzero >= 10 and count(plus) (or count(minus)) >= k2(m_nonzero)"
    valid_outputs: "for inconclusive, not_established, plus and minus: E_C and the must-report descriptions are always shown; a ratio or interval whose denominator is 0 is undefined (never 0)"
  inconclusive_reading: "only that the direction question has no answer (fewer than 10 individuals with C_2 != 0); never 'directions did not align', never 'stretched weights do not reach choice'"
