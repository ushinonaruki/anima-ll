# 実験 0034 の実行条件と記録項目（事前登録の案 v0.2。ChatGPT のレビュー待ち・未確定。この実験の道具の実装の前に固定する）
#
# AS1（自発の 1 つの行動、L = 2、外の刺激なし）の閉ループで、区間 W のすべての結果の刺激 e について、
# Pulse t（意図の Pulse）の処理の後で個体と世界を複製し、複製の側で e の予約だけを取り消した系 N と、本体（系 F）の
# 次の意図の時刻を比べる（命題 G-6。推定対象 A）。個体ごとに、e が次の意図を早めた出来事の数 n_plus が遅らせた数 n_minus を
# 上回るか（P_i）を数え、適用できる個体の数 m に対する二項の上側の閾値で判定する（README §2〜§5）。
# 推定対象 B（CF-2）と、直接の接続 受→源 を通った分（FB-1）は補助の記録で、判定しない（README §6）。
#
# この案の段階では、この実験の道具の実装・smoke・本番の測定・seed の実行はしない（README の Status・§14）。
# 確定の後は、測定の結果（本番・smoke・合成のどれでも）を見てからの事後の変更は禁止。変更が要る場合は理由と見たもの・使った seed を
# 開示し、新しい版・新しい seed の範囲で行う。④正式な実験の実行は、改めて承認を得てから行う。
#
# 種別：事前登録した検証。主の判定は J_A の 1 つ。
# 値はどれも、この実験の手順を決める足場で、AnIma-ll の脳の生物値ではない。新しく選んだ値とその理由は README §1.1。

experiment: "0034"
kind: preregistered_test
seeds: {first: 27001, last: 27020}            # 本番。20 個体を全件記録・全件報告する。以後どの実験にも使わない
smoke_seeds: {first: 27101, last: 27106}      # 操作の確認だけ。判定の量・現象の数値は計算・表示・保存しない
synthetic_seeds: {first: 27201, last: 27299}  # 合成の契約テスト専用
seen_out_of_range_seeds: {first: 9001, last: 9012}   # ②の道具の確かめで走らせた（意図の数などを見た。README §11）

tools:
  base: experiments/as1_closed_loop/as1.py    # #148（merge efd6d52）。この実験の道具はこれを読むだけで変えない
  contract_tests: tests/integration/test_as1_contract.py

brain:                                  # C0 のまま（0028〜0033 と同じ）
  manifest: experiments/0012_passive_world/neuroarchitecture.yaml
  added_by_tool: {effector: effector.y1, intent_port: intent, intent_projections: "sK.intent -> effector.y1 (K = 1, 2, 3)"}
  sensory_units: [s1, s2, s3]
  receptors: {receptor.x1: s1, receptor.x2: s2, receptor.x3: s3}
  refractory_pulses: 0
  plastic_connections: six_s_to_s
  adaptation_tau_pulses: 300            # 設計図の adaptation_tau（秒）÷ pulse_interval_seconds

roles:                                  # 個体ごと（K2）。名前で分けた乱数の流れ
  stream: "as1-roles-{seed}"
  rule: "random.Random(stream).shuffle([s1, s2, s3]) -> (source, receiver, other)"
  consequence_receptor: "receptor of receiver"

world:                                  # README §1.1
  delay_L: 2                            # 結果の刺激は意図の Pulse t の t + L - 1 = t + 1
  multiplicity: per_reservation         # 1 予約に 1 出来事（命題 W-2 により、この構成では予約は重ならない）
  respond: true
  exogenous: []                         # 外の刺激なし
  payload: none

timeline:                               # Pulse（1 Pulse = 1 秒）
  pulse_interval_seconds: 1.0
  event_window:                         # 結果の刺激 e の Pulse の範囲
    first: "adaptation_tau_pulses + 1"                  # 301
    last: "6 * adaptation_tau_pulses"                   # 1800（長さ 5 * adaptation_tau_pulses = 1500）
  branch_pulse: "e.pulse - (delay_L - 1)"               # 意図の Pulse t。t の処理の後（Pulse のあいだ）で分岐する
  horizon_H: "adaptation_tau_pulses"                    # 300。t の後 t + H までに次の意図がなければ打ち切り
  body_runs_to: "event_window.last - (delay_L - 1) + horizon_H"   # 2099

events:
  definition: "all intents at t with consequence reservation e (origin = intent delta id) and e.pulse in event_window"
  sampling: none                        # すべて使う
  counterfactual:
    F: "the body itself (deterministic continuation)"
    N: "clone(body at end of t) with only reservation e cancelled by id (CT-Sigma5)"
  next_intent:
    F: "first pulse > t in body.world.intents"
    N: "advance_until_first_intent(N, t, t + H)"         # 源の Unit の fire_count で検知（ログに依らない）
  sign:                                 # README §2.3
    both_found: "sign(tau_N - tau_F)"
    only_F_found: "+"
    only_N_found: "-"
    none_found: "?"

judgment:
  per_individual:
    counts: [n_plus, n_minus, n_zero, n_unknown]
    applicable: "body F has at least one consequence reservation e with e.pulse in event_window"   # 本体だけで、反実仮想の前に決まる（A3）
    not_applicable: "no event in event_window (e.g. the source never fires in W)"
    event_P_i: "n_plus > n_minus"       # 等しいとき（n_plus = n_minus = 0 を含む）は成り立たない
  J_A:
    min_applicable: 10                  # m < 10 なら判定不能
    rule: "count(P_i over applicable individuals) >= k(m)"
    k_of_m: {10: 9, 11: 9, 12: 10, 13: 10, 14: 11, 15: 12, 16: 12, 17: 13, 18: 13, 19: 14, 20: 15}
    k_definition: "smallest k with P(Binomial(m, 1/2) >= k) <= 0.05"
    alpha: 0.05
    direction: one_sided_plus           # 早める向き。機構から先に決まる（README §3.3）
  null: "H0_dir: P(n_plus > n_minus) <= 1/2 for iid Birth States whose body has at least one event in W"
  model_assumption: "the 0.05 bound holds within a model of iid Birth States; sequential deterministic seeds do not by themselves establish independence"

auxiliary:                              # 判定に使わない（README §6）
  R2_CF2:
    systems: [F_CF, N_CF]               # 本体の複製と N の複製
    intervention: {kind: FREEZE, targets: all_six_plastic, trace_policy: advance, declared_at_boundary: t, declared_once: true, cleared: never}
    record: [tau_F_CF, tau_N_CF, d_CF, B]
  R3_FB1:
    systems: [F_FB, N_FB]
    intervention: {kind: FB1, targets: ["receiver.main->source"], declared_at_boundary: t, declared_once: true, cleared: never}
    record: [tau_F_FB, tau_N_FB, d_FB]
  R4_individual: [roles, intents_in_window, interval_summary, counts, fraction_nonzero, median_d_e, P_i]
  R5_weights:
    pulses: [300, 600, 900, 1200, 1500, 1800, 2099]
    record: [six_weights_and_traces, pair_sums]
  R6_interval: {method: clopper_pearson, level: 0.95, of: "fraction of applicable individuals with P_i"}

operation_checks:                       # README §7。生の記録から再検証。一つでも満たさなければ無効
  O1: contract tests pass at the measurement commit
  O2: intents equal source firings; each consequence realized at t + 1 on the consequence receptor; zero stimuli on the source receptor; no overlapping consequence reservations
  O3: a no-intervention clone at pulse 300 equals the body in sigma up to pulse 600
  O4: per event, N pending = body pending minus e at the branch; N sensory = body sensory minus e up to min(tau_F, tau_N, t + H)
  O5: FREEZE targets constant in the auxiliary window; FB-1 transmitted weight of receiver->source is 0
  O6: seeds do not overlap previously run seeds

records:
  body_log_keep: [RUN, SENSORY, ACTIVITY, DELTA, EFFECT]
  save: "results/<seed>.json (R1..R6 and raw records for O2..O5)"
