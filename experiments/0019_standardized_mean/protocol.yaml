# 実験 0019 の実行条件と判定基準（事前登録の案 v0.2。道具より前にコミットする）
#
# なぜこの条件なのかは README.md に書く。値はどれも、この実験の手順を決める足場で、AnIma-ll の脳の生物値ではない。
# 経験・無入力の区間・試しの時刻・runtime の境界は 0017 v0.3・0018 v0.2 と同じ。違うのは介入と seed だけ：
# 2 腕とも A–B／A–C の 4 本を対称 contrast 背景（W ＝ x − y ＝ 0）に置き、forward mean m ＝ (x ＋ y)／2 だけを
# 腕 ordered_m では ordered の、腕 shuffled_m では shuffled の、同じ時点・同じ境界の値にする（0018 の補完）。

seeds: {first: 12001, last: 12020}      # 新しい seed。これまでの seed（1〜20・1001〜1020・2001〜2020・3001〜3006・4001〜4020・5001〜5006・6001〜6020・7001〜7006・8001〜8020・8101〜8106・10001〜10020・10101〜10106・11001〜11020・11101〜11106）と合成・探索の 9001〜9599 を避ける
synthetic_seeds: {first: 9600, last: 9699}   # 合成の契約テスト専用（判定にも smoke にも使わない。使ったものは道具の PR に記録）

brain:
  manifest: experiments/0012_passive_world/neuroarchitecture.yaml   # 0014〜0017 と同じ
  dynamics_from: config/neuroarchitecture/minimal-v3.yaml
  sensory_units: [s1, s2, s3]
  receptors: {receptor.x1: s1, receptor.x2: s2, receptor.x3: s3}

timeline:                               # Pulse（1 Pulse ＝ 1 秒）。0016・0017 と同じ
  pulse_interval_seconds: 1.0
  trials: {first: 1, every: 60, count: 200}
  experience_end: "trials.first - 1 + trials.count * trials.every"   # 12000
  endpoint: "2 * experience_end"                       # 24000
  probes: {first: "endpoint + 1", every: 1, count: "adaptation_tau / pulse_interval_seconds"}   # 24001〜24300
  total_pulses: "endpoint + probes.count"              # 24300
  clone_end: "t0 + probe.read_at"                      # 2 腕は t0 ＋ 2 まで。提供側の試しの元は t0 の終わりまで

stimulus:                               # 0015・0017・0018 と同じ（乱数の流れの名前だけ 0019 で分ける。常設チェック C4）
  b_offset: 2
  c_offset: 30
  counts: {A: 200, B: 200, C: 200}
  rng_shuffle: "0019-shuffle:{seed}"
  conditions: [ordered, shuffled]
  role_assignment: "(seed - 1) mod 6"
  role_orders:
    - [receptor.x1, receptor.x2, receptor.x3]
    - [receptor.x1, receptor.x3, receptor.x2]
    - [receptor.x2, receptor.x1, receptor.x3]
    - [receptor.x2, receptor.x3, receptor.x1]
    - [receptor.x3, receptor.x1, receptor.x2]
    - [receptor.x3, receptor.x2, receptor.x1]

probe:                                  # 0017 と同じ
  read_at: 2
  fork_after: 0
  recipient: ordered                    # 2 腕の土台（Unit の状態・痕跡・B–C・対象外）は ordered の試しの元
  donor: shuffled                       # m_shuffled は、shuffled の本体から同じ手順で作った試しの元の t0 の終わりの値
  boundary: after_pulse_t0_plasticity_before_t0_plus_1_weight_freeze   # 受け手・提供側とも同じ境界（0017 §3.3）

intervention:
  arms: [ordered_m, shuffled_m]         # どちらも自然な状態ではないので as_is とは呼ばない
  rule: symmetric_contrast_background_with_history_mean
  # 各腕：W ＝ 0、m ＝ その履歴の m(t0)（ordered_m は受け手の、shuffled_m は提供側の）
  #   w(A→B) ＝ w(A→C) ＝ m、w(B→A) ＝ w(C→A) ＝ w_max − m
  background_contrast: "0"              # 自然にありうる全ての m（0 ≤ m ≤ w_max）を、切り詰めなしで 1 つの固定の W に載せられる唯一の値（README §3.2）
  new_values: none                      # 切り詰め・拡大縮小・適用条件を置かない

judgment:
  # 各試し：E(t0) ＝ |B_ordered_m − B_shuffled_m| ＋ |C_ordered_m − C_shuffled_m|（B・C は t0 ＋ 2 に発火したら 1）
  # 個体ごと：S ＝ Σ_t0 E(t0)
  primary: s
  s: {statistic: "sum_t0(E(t0))", passes_if: "> 0"}   # standardized-background sufficiency test（nonzero。向きの検定ではない）
  applies_to: all_individuals           # m_ordered ＝ m_shuffled の試し・個体も専用に除外しない（README §4）
  min_fraction: 0.8                     # Birth State 間の頑健性の基準（効果の大きさの閾値ではない。母集団の割合についての統計的な主張でもない。常設チェック D6）
  manipulation:
    stimulus_counts: true
    input_free_after_experience: true
    identical_before_divergence: true
    clone_identity: true
    probe_input_delivered: true         # 受け手・提供側の試しの元がどちらも t0 に Receptor A の出来事を 1 つだけ受ける
    standardized_arms: true             # 2 腕の 4 本が式どおり（W ＝ 0、m は各履歴の値、組の和 ＝ w_max）。痕跡・Unit の状態・B–C・対象外は受け手の試しの元と同じ
    fork_matches_bodies: true           # 受け手の試しの元の重み ＝ ordered の本体の t0 の終わり、提供側の 4 本 ＝ shuffled の本体の t0 の終わり
    arms_identical_until_divergence: true   # 2 腕の t0 ＋ 1 の発火が一致
    replay_matches_recorded_weights: 1.0e-12  # 両条件の終端（24000）の重みが、発火の記録から再生した重みと一致
    revalidate_from_raw: true
    no_statistics_when_invalid: true

smoke:
  seeds: {first: 12101, last: 12106}
  checks: {manipulation: all}
  # 次はどれも、計算しない・表示しない・保存した報告に出さない（開発中も出力しない。README §7、常設チェック D4）
  hide:
    - E                                 # 各試しの E(t0)
    - s                                 # 個体ごとの S と判定
    - dm_fork                           # 各試しの m_ordered − m_shuffled（＝ 2 腕の m の差）
    - target_weight_differences         # 2 腕の 4 本それぞれの差
    - changed_weight_count              # 各試しで 2 腕の 4 本のうち違った本数
    - recipient_contrast_displacement   # 各試しの W_o（旧値 − 新値＝標準化で取り除いた量。実際に加えた差分は −W_o）
    - donor_contrast_offset             # 各試しの W_s − 0（提供側の自然な contrast。介入の量ではない）
  on_failure: stop_and_amend
