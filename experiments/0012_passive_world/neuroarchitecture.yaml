# 実験 0012 用の脳の設計図（Neuroarchitecture Manifest）
#
# 【位置づけ】実験 0012（README.md §2）の足場。AnIma-ll の脳の新しい版ではない。
#   - 力学の値（defaults.dynamics）は config/neuroarchitecture/minimal-v3.yaml と同じ（変えない）。
#     同じであることは alignment.py が実行・分析の前に機械的に確かめる
#   - 可塑性の値は protocol.yaml の brain.plasticity と同じ（同じく alignment.py が確かめる）
#   - Receptor → s の 1 対 1 は、配線による役割の付与に近い足場（可塑性 v1 の設計案 §4.1）。可塑性の対象外
#   - s1〜s3 のあいだの 6 本だけが可塑性の対象。初期の重み 0.005 ＝ w0 ＝ w_max／2（protocol の w0: half_w_max。
#     v0.3：可塑性 v1.1 で w_max ＝ α ＝ 0.01。設計原則 P1：1 本の接続の 1 回の伝達は、受け手自身の 1 回の発火による
#     自己抑制を超えない）。w_max／2 は、釣り合った窓と柔らかい上限・下限の組み合わせで、偏りのない組の数なら
#     期待値が釣り合う、という規則の側の理由で決まる値（設計案 §3.2）
#   - LLM・Kernel なし（resources なし）。出力の部品は relay（中身を何も出さない）。Effector なし
#   - 刺激（どの Receptor にいつ感覚の出来事が来るか）は実行環境の側で、run.py が protocol から作る
#
# - Unit に役割は書かない。どの s が A・B・C の側になるかは個体ごとに Receptor の割り当てで決まる（protocol）

version: 3               # 力学の解釈は minimal-v3 と同じ（c2 の活動の伝達）。版の番号は来歴のログに残るだけ
delta_ttl_pulses: 10     # minimal-v3 と同じ。この設計図では Delta は生じない

interfaces:
  resources: []
  receptors: [receptor.x1, receptor.x2, receptor.x3]
  effectors: []

defaults:
  dynamics:              # minimal-v3 の defaults.dynamics と完全に同じ（値の意味・根拠は minimal-v3 を見る）
    kind: simple_activity
    decay: 0.85
    threshold: 0.5
    refractory_pulses: 0
    intrinsic_drive: 0.08
    jitter: 0.1
    initial_activity_max_ratio: 0.5
    adaptation_increment: 0.01
    adaptation_tau: 300

units:
  - id: s1
    output: relay
  - id: s2
    output: relay
  - id: s3
    output: relay

# 可塑性 v1.1（docs/plasticity-v1-proposal.md ＋ docs/plasticity-v1.1-scale.md）。値は protocol.yaml の brain.plasticity と同じ
plasticity:
  rule: balanced_pair_window
  trace: additive
  bounds: soft
  trace_tau: activity_time_constant   # −1/ln(decay) ≒ 6.15 秒
  w_min: 0.0
  w_max: adaptation_increment         # α ＝ 0.01（v0.3。v0.2 では threshold ＝ 0.5）
  amplitude_ratio: 0.01               # A ／ w_max

# receptor.x1 ─(1.0)→ s1
# receptor.x2 ─(1.0)→ s2      s1・s2・s3 のあいだの 6 本：初期の重み 0.005、可塑性の対象
# receptor.x3 ─(1.0)→ s3
projections:
  - { from: receptor.x1.main, to: s1, weight: 1.0 }
  - { from: receptor.x2.main, to: s2, weight: 1.0 }
  - { from: receptor.x3.main, to: s3, weight: 1.0 }
  - { from: s1.main, to: s2, weight: 0.005, plastic: true }
  - { from: s1.main, to: s3, weight: 0.005, plastic: true }
  - { from: s2.main, to: s1, weight: 0.005, plastic: true }
  - { from: s2.main, to: s3, weight: 0.005, plastic: true }
  - { from: s3.main, to: s1, weight: 0.005, plastic: true }
  - { from: s3.main, to: s2, weight: 0.005, plastic: true }
