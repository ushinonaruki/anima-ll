# 実験 0012 の実行条件と判定基準 v0.3（事前登録の一部。本番の測定の前にコミットする）
#
# なぜこの条件なのかは README.md に書く。ここには、run.py と analyze.py が実際に使う値だけを書く。
# 値はどれも、この実験の手順を決めるもので、AnIma-ll の脳の生物値ではない。
#
# v0.2（prereg-v0.2/protocol.yaml）からの変更は 2 つだけ（README §0）：
#   1. brain.plasticity.w_max：threshold → adaptation_increment（可塑性 v1.1。w0 は同じく w_max／2）
#   2. smoke（動作確認の seed・項目・基準）を足した（v0.3 の設計条件 C7）。旧の smoke_seed は smoke.seeds に置き換えた
# 判定（judgment）・環境（stimulus）・時間の流れ（timeline）・試し（probe）の値は v0.2 と同じ。

seeds: {first: 1, last: 20}

brain:
  dynamics_from: config/neuroarchitecture/minimal-v3.yaml   # 力学の値はここから（変えない）
  sensory_units: [s1, s2, s3]
  receptors: {receptor.x1: s1, receptor.x2: s2, receptor.x3: s3}
  receptor_weight: 1.0              # Receptor → s。可塑性の対象外
  plasticity:
    rule: balanced_pair_window      # 釣り合った窓（d ≥ 1 で強め、d ≤ −1 で同じ大きさで弱め、d = 0 は学ばない）
    trace: additive                 # 発火のたびに 1 を足す
    trace_tau: activity_time_constant   # τ_x ＝ τ_m ＝ −1/ln(decay)（≒ 6.15 秒）
    bounds: soft                    # 強める量 ×(w_max − w)/w_max、弱める量 × w/w_max
    w_min: 0.0
    w_max: adaptation_increment     # v0.3：可塑性 v1.1。順応の 1 段 α（minimal-v3 では 0.01）。設計原則 P1
    w0: half_w_max                  # w_max／2（＝ α／2）
    amplitude_ratio: 0.01           # A ／ w_max（v0.2 と同じ比）

timeline:                           # Pulse（1 Pulse ＝ 1 秒）
  pulse_interval_seconds: 1.0
  total_pulses: 15000
  pre_probes: {first: 600, every: 60, count: 20}
  trials: {first: 1800, every: 60, count: 200}
  post_probes: {first: 13800, every: 60, count: 20}

stimulus:
  delta_pulses: 2                   # A から B・C まで
  p_b: 0.8                          # 200 回のうち 160 回が B、40 回が C（数は固定、順番は刺激用の乱数）
  rng_ordered: "seed * 1000 + 12"   # 順序あり：どの試行が B でどれが C か（Birth State の乱数とは別の流れ）
  rng_shuffle: "seed * 1000 + 13"   # 順序を崩した刺激：順序ありの 400 個の刺激の札の並べ替え（別の流れ）
  conditions: [ordered, shuffled, silent]
  role_assignment: "(seed - 1) mod 6"   # 6 通りの並べ方の番号（下の順）
  role_orders:                      # [A, B, C] に割り当てる Receptor
    - [receptor.x1, receptor.x2, receptor.x3]
    - [receptor.x1, receptor.x3, receptor.x2]
    - [receptor.x2, receptor.x1, receptor.x3]
    - [receptor.x2, receptor.x3, receptor.x1]
    - [receptor.x3, receptor.x1, receptor.x2]
    - [receptor.x3, receptor.x2, receptor.x1]

probe:
  clone_pulses: 10                  # 複製を進める長さ
  response_window: [2, 4]           # t0 からの相対 Pulse（両端を含む）
  a_fired_at: 1                     # 操作の確認：s_A が t0 + 1 に発火したか

judgment:
  h1:
    # 同じ個体で D(ordered) > 0 かつ D(ordered) > D(shuffled) かつ D(ordered) > D(silent) を同時に満たす個体数
    min_seeds_all: 16
  m:
    # W ＝ 経験の後の w(A→B) − w(A→C)。同じ個体で W(ordered) > 0 かつ > W(shuffled) かつ > W(silent) を同時に満たす個体数
    min_seeds_all: 16
  manipulation:
    min_a_fired_fraction: 0.9       # 条件ごとの、試しで s_A が t0 + 1 に発火した割合
    expected_counts:
      ordered: {A: 200, B: 160, C: 40, a_then_b: 160, a_then_c: 40}
      shuffled: {A: 200, B: 160, C: 40}
      silent: {A: 0, B: 0, C: 0}
    clone_identity_check: true      # 試しなしの複製が本体と一致すること（各個体で 1 回）
    identical_before_pulse: 1800    # 同じ seed の 3 条件で、この Pulse より前の発火・接続の状態・経験の前の試しが完全に一致すること

# v0.3：動作確認（設計条件 C7）。判定の seed（1〜20）の前に、範囲外の seed だけで、測定の道具が
# 構造的に飽和していないことを確かめる。ここでは D・W・H1・M を計算も表示もしない（README §5.5）
smoke:
  seeds: {first: 1001, last: 1006}  # (seed − 1) mod 6 が 6 通りすべてになる範囲外の seed
  # 「確実に起きる」の水準は、操作の確認 manipulation.min_a_fired_fraction（0.9）と同じ値を使う（新しい値を足さない）
  reliable_fraction: manipulation.min_a_fired_fraction
  checks:
    c1_no_baseline_ceiling:
      # 経験の前の試し（全 smoke seed をまとめる。3 条件は Pulse 1799 まで同じなので ordered の分を使う）で、
      # s_B が窓で発火した割合 と s_C が窓で発火した割合 が、どちらも reliable_fraction 未満
      max_fraction_exclusive: reliable
    c2_no_long_reverberation:
      # 連鎖 ＝ s1〜s3 のどれかが発火した Pulse が途切れずに続く区間。
      # 経験の前の試しの複製で、t0 + 1 から始まる連鎖が複製の最後（t0 + clone_pulses − 1）まで続いた割合、
      # 順序ありの経験の各試行で、t + 1 から始まる連鎖が t + clone_pulses まで続いた割合 が、どちらも 1 − reliable_fraction 未満
      max_fraction_exclusive: one_minus_reliable
    c3_sensory_not_buried:
      # 順序ありの経験（全 smoke seed）で、s_B と s_C が t + 2（s_A の発火の駆動だけが届く Pulse）に両方発火した試行の割合が
      # reliable_fraction 未満
      max_fraction_exclusive: reliable
  # どれか 1 つでも満たさなければ、本番（seed 1〜20）は走らせない。値を変えて動作確認をやり直すこともしない。
  # 結果を記録し、改訂（v0.4）として設計の問いに戻す
  on_failure: stop_and_amend
