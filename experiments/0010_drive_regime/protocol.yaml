# 実験 0010 の実行条件と判定基準（事前登録の一部。測定の前にコミットする）
#
# なぜこの条件なのかは README.md に書く。ここには、run.py と analyze.py が実際に使う値だけを書く。
# 判定の値（16 個体・0.3 など）の正本もここ。analyze.py は 0004・0005 の analyzer から生の集計（落ち着いた個体数・
# α = 0 との差）だけを再利用し、成り立つかどうかはここの値で決める
# 値はどれも、この実験の手順を決めるもので、AnIma-ll の脳の値ではない。

base_neuroarchitecture: config/neuroarchitecture/minimal-v2.yaml

# 正本は、実際に操作する intrinsic_drive の値。ρ はここから計算する（表示用の丸めた値から逆算しない）
#   ρ = intrinsic_drive / ((1 − decay) × threshold)。decay・threshold は設計図の値（0.85・0.5）を使い、変えない
#   0.0500 → ρ 0.667、0.0675 → 0.900、0.0750 → 1.000、0.0800 → 1.067、0.0975 → 1.300、0.1200 → 1.600、0.1500 → 2.000
intrinsic_drive_values: [0.0500, 0.0675, 0.0750, 0.0800, 0.0975, 0.1200, 0.1500]
current_intrinsic_drive: 0.0800   # 今の値（minimal-v2）。0009 の K1・K2 とまったく同じ設定になる

# 0004・0005 と同じ手順（関数は 0004・0005 の run.py をそのまま使う）
adaptation_conditions:            # [α, τ_a]
  - [0.0, 0]
  - [0.005, 30]
  - [0.005, 300]
  - [0.005, 1200]
  - [0.01, 30]
  - [0.01, 300]
  - [0.01, 1200]
  - [0.02, 30]
  - [0.02, 300]
  - [0.02, 1200]
seeds: {first: 1, last: 20}
k1:
  silent_pulses: 3600
  reference_conditions: [[0.01, 300], [0.01, 1200], [0.02, 300], [0.02, 1200]]
  min_calmed_seeds: 16            # 0004 と同じ
  applicability:                  # 該当しない（N/A）の基準：α = 0 の終盤に 1 回以上発火した個体がこれ未満
    window: [1801, 3600]          # 0004 の終盤と同じ
    min_active_seeds: 16
k2:
  reference_conditions: [[0.01, 300], [0.01, 1200], [0.02, 300], [0.02, 1200]]
  min_difference_from_alpha0: 0.3 # 0005 と同じ
k3:
  reference_value: [0.01, 300]
  # 選び方の規則（0005 と同じ）：K1・K2 を条件別にともに満たす条件（α = 0 を除く）のうち、
  # α × τ_a が最小、同じなら α が小さい方。条件別の成立は上の k1・k2 の値で判定した表を使う
  selection: min_alpha_times_tau_then_alpha

environment:                      # 0004〜0009 と同じ
  workers: 1
  kernel: fake_delayed
  delay_seconds: 3
  queue_capacity: null            # 上限なし
