# 実行環境：L0 の偽 Kernel で、入力を一切与えない（実験 0002 のベースライン）

resources:
  llm_pool:
    capacity: 1
    # queue_capacity: 実行待ちの列の上限。書かなければ上限なし（計算資源境界 仕様 §3.3）。
    #   超えたら新しい意図を受け付けず、run を劣化として記録する
    kernel: fake_delayed
    delay_seconds: 3
    # delay_jitter_seconds: 2   # アブレーション b：推論時間のばらつきだけを入れる

receptors:
  receptor.console:
    kind: scripted
    script: {}

effectors:
  effector.console:
    kind: console

runtime:
  pulse_interval_seconds: 1.0   # 1 Pulse の秒数（時間の解像度）。減衰・順応は秒で書かれているので認知に効く。値に根拠なし（台帳 §3.9）
