# AnIma-ll 最軽量版 Neuroarchitecture Manifest（L0）
#
# - Unit に役割は書かない（role: memory などは読み込み時にエラーになる）
# - 違いは配線（projections）と部品・パラメータだけで表す
# - Unit の名前は番号だけ。「u0 は感覚野」などとは決めない

version: 0
seed: 42                 # 初期値のばらつき用（出生時の条件）
delta_ttl_pulses: 10     # Delta が BrainState に残る Pulse 数

resources:
  llm_pool:
    capacity: 1
    kernel: fake_delayed # L1 で ollama に差し替える
    delay_seconds: 3     # 偽 Kernel が「考える」秒数

receptors:
  - id: receptor.console
    kind: scripted       # L0 は台本どおりに入力を出す。L1 で console に差し替える
    script:
      5: "ただいま"
      40: "今日は少し疲れた"

effectors:
  - id: effector.console
    kind: console

defaults:
  dynamics:
    kind: simple_activity
    decay: 0.85          # 1 秒あたりの減衰率
    threshold: 0.5
    refractory_pulses: 3
    intrinsic_drive: 0.08  # 入力がなくても活動がゆっくり動き続ける（内容非依存）
                           # 平衡値 ≒ drive / (1 - decay) ≒ 0.53 で閾値をわずかに上回る。
                           # 0.05 だと平衡値 ≒ 0.33 で、入力がない限り一度も発火しない
    jitter: 0.1          # Unit ごとのパラメータのばらつき（±10%）

units:
  - id: u0
    output: relay
  - id: u1
    output: { kind: kernel_request, resource: llm_pool, io_template: associate }
  - id: u2
    output: { kind: kernel_request, resource: llm_pool, io_template: associate }
  - id: u3
    output: { kind: kernel_request, resource: llm_pool, io_template: utter }

# receptor.console ─→ u0 ─┬─→ u1 ─┐
#                         │   ↕   ├─→ u3 ─→ effector.console
#                         └─→ u2 ─┘
projections:
  - { from: receptor.console.main, to: u0, weight: 1.0 }
  - { from: u0.main, to: u1, weight: 1.0 }   # 分岐
  - { from: u0.main, to: u2, weight: 1.0 }
  - { from: u1.main, to: u2, weight: 0.4 }   # 弱い相互作用（再帰）
  - { from: u2.main, to: u1, weight: 0.4 }
  - { from: u1.main, to: u3, weight: 0.6 }   # 再収束
  - { from: u2.main, to: u3, weight: 0.6 }
  - { from: u3.main, to: effector.console }
