[project]
name = "anima-ll"
version = "0.0.1"
description = "AnIma-ll: 生活空間の隣で継続して存在する AI 生命体 / AI 隣人"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["anima_ll*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
